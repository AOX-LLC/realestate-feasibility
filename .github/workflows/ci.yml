name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      # The check fails on a folder with no recordings, so it runs once there are some.
      - name: Check recorded model responses
        run: |
          if find data/llm/replays -name '*.json' -print -quit | grep -q .; then
            uv run aox-agent-core cassettes check data/llm/replays
          else
            echo "No recordings yet; nothing to check."
          fi

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        # postgres:16-alpine, index digest resolved 2026-10-02
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: feasibility
          POSTGRES_PASSWORD: feasibility
          POSTGRES_DB: feasibility_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U feasibility -d feasibility_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest
        env:
          TEST_DATABASE_URL: postgresql+psycopg://feasibility:feasibility@localhost:5432/feasibility_test

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan history for secrets
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --verbose

  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start the stack
        run: docker compose up -d --wait --build
      - name: Health check
        run: curl --fail --silent --show-error http://127.0.0.1:4501/health
      - name: Parcels endpoint
        run: curl --fail --silent --show-error "http://127.0.0.1:4501/parcels?limit=5"
      - name: Show logs on failure
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v
