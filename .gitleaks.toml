# The default rules, plus one narrow exception.
[extend]
useDefault = true

[[allowlists]]
description = "the workflow's URLs, http://api:4501/triggers/<name>, is read as an api key: it is the address of the API service inside Compose (tests/test_n8n_workflow.py checks that the file holds no token)"
condition = "AND"
paths = ['''^n8n/morning-brief\.json$''']
regexes = ['''^4501/triggers/[a-z]+$''']
