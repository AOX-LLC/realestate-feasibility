name: realestate-feasibility

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=64m,uid=10001,gid=10001,mode=1700"]
  pids_limit: 256

# The one writable path in the app containers: CAD archives in, verify-rentcast reports out.
# It is gitignored and bind-mounted only into the services that read or write it.
x-local-dir: &local-dir
  volumes:
    - ./local:/app/local

x-app: &app
  build:
    context: .
    args:
      GIT_COMMIT: ${GIT_COMMIT:-}
      GIT_BRANCH: ${GIT_BRANCH:-}
  image: realestate-feasibility:dev
  environment:
    DATABASE_URL: postgresql+psycopg://feasibility:${POSTGRES_PASSWORD:-feasibility-local-dev}@db:5432/feasibility
    DATA_MODE: ${DATA_MODE:-mock}
    RENTCAST_API_KEY: ${RENTCAST_API_KEY:-}
    RENTCAST_MONTHLY_BUDGET: ${RENTCAST_MONTHLY_BUDGET:-50}
    RENTCAST_BILLING_ANCHOR_DAY: ${RENTCAST_BILLING_ANCHOR_DAY:-1}
    MARKET: ${MARKET:-dallas}

services:
  db:
    # postgres:16-alpine, index digest resolved 2026-10-02
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp:size=64m", "/run/postgresql:size=8m"]
    pids_limit: 256
    environment:
      POSTGRES_USER: feasibility
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-feasibility-local-dev}
      POSTGRES_DB: feasibility
    ports:
      - "127.0.0.1:4502:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feasibility -d feasibility"]
      interval: 3s
      timeout: 3s
      retries: 20
    mem_limit: 512m

  migrate:
    <<: [*app, *hardening, *local-dir]
    command: ["sh", "-c", "feasibility migrate && feasibility seed"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    mem_limit: 384m

  api:
    <<: [*app, *hardening]
    ports:
      - "127.0.0.1:4501:4501"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:4501/health', timeout=3).status == 200 else 1)"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    mem_limit: 256m

  worker:
    <<: [*app, *hardening, *local-dir]
    command: ["feasibility", "worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 256m

volumes:
  pgdata:
