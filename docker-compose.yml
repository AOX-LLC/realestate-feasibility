name: realestate-feasibility

# Every service sets mem_limit (tests/test_compose.py fails the build if one does not). Each limit
# is at least twice the peak working set `docker stats` showed over a seeded day-1 run in mock
# mode (2026-10-08, synthetic snapshot): db 140 MiB, migrate (migrate, seed and both days' runs)
# 81 MiB, api 88 MiB after a request of each kind, worker 76 MiB while it ran a `sourcing.run`
# job. The cgroup's own peak agreed within 20% (db: 268 MiB, but that counts the page cache of a
# day of test runs, which the kernel reclaims before it kills anything).
# The db and migrate limits are larger than twice because real county data is bigger than the
# snapshot and has not been measured: re-measure before trusting them with it.

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=64m,uid=10001,gid=10001,mode=1700"]
  pids_limit: 256

# The one writable path in the app containers: verify-rentcast reports go out through
# migrate. It is gitignored. The worker only reads CAD archives from it, so it is read-only there.
x-local-dir: &local-dir
  volumes:
    - ./local:/app/local

x-local-dir-read-only: &local-dir-read-only
  volumes:
    - ./local:/app/local:ro

# The app's own variables, shared by every service that runs the app.
x-app-environment: &app-environment
  DATABASE_URL: postgresql+psycopg://feasibility:${POSTGRES_PASSWORD:-feasibility-local-dev}@db:5432/feasibility
  DATA_MODE: ${DATA_MODE:-mock}
  RENTCAST_API_KEY: ${RENTCAST_API_KEY:-}
  RENTCAST_MONTHLY_BUDGET: ${RENTCAST_MONTHLY_BUDGET:-50}
  RENTCAST_BILLING_ANCHOR_DAY: ${RENTCAST_BILLING_ANCHOR_DAY:-1}
  MARKET: ${MARKET:-dallas}

# Model settings, merged into worker and migrate only. The api never calls a model, so it never
# receives the key (tests/test_compose.py asserts it).
x-llm-environment: &llm-environment
  AGENT_CORE_MODE: ${AGENT_CORE_MODE:-replay}
  AGENT_CORE_ANTHROPIC_API_KEY: ${AGENT_CORE_ANTHROPIC_API_KEY:-}
  AGENT_CORE_CONFIG: /app/data/llm/agent-core.toml
  LLM_RUN_BUDGET_USD: ${LLM_RUN_BUDGET_USD:-1.00}
  LLM_MONTHLY_BUDGET_USD: ${LLM_MONTHLY_BUDGET_USD:-10.00}

# The caps the api reports (`/llm/cost`, `/llm/spend`) must be the ones the worker enforces. They
# are the only model settings the api receives: no mode, no key.
x-llm-budgets: &llm-budgets
  LLM_RUN_BUDGET_USD: ${LLM_RUN_BUDGET_USD:-1.00}
  LLM_MONTHLY_BUDGET_USD: ${LLM_MONTHLY_BUDGET_USD:-10.00}

x-app: &app
  build:
    context: .
    args:
      GIT_COMMIT: ${GIT_COMMIT:-}
      GIT_BRANCH: ${GIT_BRANCH:-}
  image: realestate-feasibility:dev
  environment: *app-environment

services:
  db:
    # postgres:16-alpine, index digest resolved 2026-10-02
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp:size=64m", "/run/postgresql:size=8m"]
    pids_limit: 256
    environment:
      POSTGRES_USER: feasibility
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-feasibility-local-dev}
      POSTGRES_DB: feasibility
    ports:
      - "127.0.0.1:4502:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feasibility -d feasibility"]
      interval: 3s
      timeout: 3s
      retries: 20
    mem_limit: 512m

  migrate:
    <<: [*app, *hardening, *local-dir]
    environment:
      <<: [*app-environment, *llm-environment]
    command: ["sh", "-c", "feasibility migrate && feasibility seed"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    mem_limit: 384m

  api:
    <<: [*app, *hardening]
    environment:
      <<: [*app-environment, *llm-budgets]
    ports:
      - "127.0.0.1:4501:4501"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:4501/health', timeout=3).status == 200 else 1)"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    mem_limit: 256m

  worker:
    <<: [*app, *hardening, *local-dir-read-only]
    environment:
      <<: [*app-environment, *llm-environment]
    command: ["feasibility", "worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 256m

volumes:
  pgdata:
